services:
  db:
    image: postgres:15
    env_file:
      - .env
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codegames-network

  minio:
    image: minio/minio:latest
    container_name: codegames-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codegames-network

  api:
    build: ./codegames-api
    container_name: codegames-api
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    env_file:
      - .env
      - .env.local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      API_PORT: ${API_PORT:-4000}
      API_HOST: ${API_HOST:-0.0.0.0}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PISTON_URL: ${PISTON_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-codegames}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    depends_on:
      db:
        condition: service_healthy
      piston:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./codegames-api:/app
      - /app/node_modules
    networks:
      - codegames-network

  web:
    build: ./codegames-web
    container_name: codegames-web
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    env_file:
      - .env
      - .env.local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_PORT: ${WEB_PORT:-3000}
      API_URL: http://api:${API_PORT:-4000}
    depends_on:
      - api
    volumes:
      - ./codegames-web:/app
      - /app/node_modules
    networks:
      - codegames-network

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: codegames-piston
    ports:
      - "2000:2000"
    privileged: true
    entrypoint: ["/bin/bash", "/piston-entrypoint.sh"]
    volumes:
      - ./piston/packages:/piston/packages
      - ./piston/jobs:/piston/jobs
      - ./piston/piston-entrypoint.sh:/piston-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:2000/api/v2/runtimes',r=>{if(r.statusCode===200)process.exit(0);else process.exit(1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - codegames-network

volumes:
  pgdata:
  minio-data:

networks:
  codegames-network:
    driver: bridge
